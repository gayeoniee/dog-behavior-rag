services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gyrag-db
    environment:
      POSTGRES_USER: gyrag
      POSTGRES_PASSWORD: gyrag
      POSTGRES_DB: gyrag
    ports:
      - "5432:5432"
    volumes:
      - gyrag-pgdata:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/00-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyrag -d gyrag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gyrag-pgdata:
