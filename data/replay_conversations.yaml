# 멀티턴 재현용 대화 — `scripts.eval.replay` 가 순서대로 재생한다.
#
# 평가셋(eval_questions.yaml)과 다른 목적이다. 저쪽은 단발 질문의 검색·선별을 재고,
# 이건 **대화가 이어질 때 무너지는 것**을 본다. 실제로 여기 있는 대화들에서
# 지시문 누출·축자 반복·후속 질문이 되묻기로 흘러가는 문제가 처음 발견됐고,
# 20문항 평가셋은 그중 어느 것도 잡지 못했다.
#
# 새 대화를 넣을 때: **사용자가 실제로 겪은 흐름**을 넣는다. 지어낸 대화는
# 실사용에서 무너지는 지점을 비껴간다.

- name: night-barking-crate
  note: 밤 짖음 → 켄넬 → 분리불안. 후속 질문이 맥락을 이어받는지 본다
  turns:
    - "밤에 너무 짖는데?"
    - "켄넬 훈련이 도움이 될까?"
    - "원인은 모르겠는데 거기에서 자게하면 좋지 않을까?"
    - "그니까 켄넬 훈련이 도움이 되겠지?"
    - "혼자있는걸 싫어하는 것 같긴 해"
    - "그럼 켄넬은 아니고 따로 자라는 건가?"

# 위 대화를 고친 뒤 사용자가 다시 돌려본 흐름. 3번에서 **부분 반복**이 나왔다 —
# 1번의 진단·주의점을 재사용하고 단계 하나만 바꿨다. 축자 전체 일치가 아니라서
# 완전 일치 검사를 통과했고, 그래서 겹침 비율로 보게 됐다.
- name: night-barking-what-training
  note: 앞 답변을 밀어내는 질문(어떤 훈련을 해야하냐)에 새 내용을 내는지
  turns:
    - "밤에 좀 많이 짖어"
    - "켄넬 훈련은 어때?"
    - "그럼 어떤 훈련을 해야해?"
    - "분리불안 같으면?"

# 판단형 질문("그러면 분리불안인건가?")에 폼이 안 맞아 무너진 사례.
# 진단 자리에 "보호자는 ~알고 싶어 합니다"라는 질문 요약이 들어갔고, 1번은 뜻까지
# 뒤집어 읽었다("혼자서는 안 한다" → "혼자 있을 때 배변한다").
#
# 코퍼스 상태도 반쪽이다 — "혼자 있을 때 배변한다"는 분리불안 증상으로 잘 다뤄지지만
# (ASPCA: 보호자가 있는 자리에서 배변하면 대개 분리불안이 아니다), 반대 패턴인
# **혼자 있을 때 참는 것**은 자료가 없다. 부분만 답하고 나머지는 없다고 말해야 한다.
- name: toilet-only-with-owner
  note: 판단형 질문에 확률로 답하는지, 자료가 반만 있을 때 나머지를 인정하는지
  turns:
    - "혼자 있을때는 응가를 안해"
    - "그러면 분리불안인건가?"
