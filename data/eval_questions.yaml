# 검색 품질 평가셋 — 실제 보호자 어투
#
# coverage_questions.yaml과 다른 목적이다. 저쪽은 "네 축에 문서가 있나"를 보는
# 수집 단계 체크리스트고, 이건 **보호자가 실제로 쓰는 문장으로 검색이 쓸 만한가**를
# 잰다. 문장이 구어체·오타·감정 표현을 포함하는 게 의도다.
#
# expect:
#   covered      — 코퍼스에 전용 문서가 있어야 하고, 근거를 찾아야 통과
#   uncovered    — 아직 문서가 없는 주제. **거절해야 통과** (자료 없다고 말해야 함)
#   out-of-scope — 이 서비스 범위 밖. **거절해야 통과**
#
# uncovered/out-of-scope가 이 평가셋의 절반이다. 근거가 없을 때 지어내지 않는지가
# "RAG 느낌"의 핵심이기 때문이다. 자료를 보강하면 uncovered → covered로 옮긴다.
#
# keywords: 근거 문서라면 포함할 법한 영어 표현 (코퍼스가 영어)
#
# **키워드는 그 주제를 실제로 다뤄야만 통과하도록 고른다.** 판정이 `any`라
# 하나만 헐거우면 항목 전체가 헐거워진다. 두 가지를 피할 것 (2026-08-13 정비):
#
#   흔한 결과어   fear 16.7%, aggression 13.6%, stress 10.5%, anxiety 9.4%가
#                 answer 코퍼스 11,354청크에 걸린다. 주제와 무관한 근거도 통과한다
#   부분 문자열   judge()가 단어 시작 경계로 보므로(retrieval_report.mentions)
#                 tail←detail, aging←managing, cue←rescue는 이제 안 걸린다.
#                 다만 lead←leading처럼 **앞에서 시작하는** 오탐은 여전히 막지
#                 못하므로 그런 단어는 구절로 쓴다 ("loose lead")

# ── 전용 문서가 있는 주제 ──────────────────────────────
