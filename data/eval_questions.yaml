# RSPCA "Train Your Dog To Come When Called" 문서가 있는데도 논문에 밀려
# 상위에 못 온다. 자료 문제가 아니라 **랭킹 문제**라서 covered로 둔다 —
# doc_type 부스트(C)가 이걸 해결해야 한다.
#
# 2026-08-13 추가: 위 진단은 doc_type 부스트 이전 것이고, 지금은 절반만 맞다.
# 네 번의 실행에서 RSPCA 리콜 문서가 **두 번은 1위로 올라왔다.** 나머지 두 번은
# ASPCA 공격성 문서가 1위였고 그때 실패한다. 재작성 문구에 따라 갈린다.
#
# cue·reward를 뺐다. 리콜을 전혀 다루지 않는 훈련 문서도 그 두 단어는 갖고 있어서
# **무엇이 검색되든 통과할 수 있었다.** 좁힌 뒤로는 통과가 "RSPCA 문서가 실제로
# 올라왔다"를 뜻한다. 이 항목의 흔들림이 이제 랭킹 흔들림을 그대로 비춘다.
- question: "이름 불러도 안 와요 오라고 하면 도망가요"
  topic: recall
  expect: covered
  keywords: [recall, come when called, comes when called, coming back, '이리와', '부르면 오', '리콜', '이름을 부르']

# ASPCA 공격성 문서 + RSPCA leave 문서가 이 주제를 덮는지 평가셋이 판정하게 둔다.
# 전용 문서는 여전히 없다 — 실패하면 그게 정직한 정보다.
- question: "밥그릇 근처 가면 으르렁거려요 뺏길까봐 그러는 거죠?"
  topic: resource-guarding
  expect: covered
  # trade는 trade-off에, leave는 "leaving the dog alone"에 걸린다(분리불안 문서에
  # 흔하다). 실제 표현인 "trade up"·"leave it"으로 바꾸고 주제어 guard를 넣는다.
  keywords: [resource guarding, food guarding, guard, possessive, trade up, leave it, '소유 공격', '밥그릇', '뺏기', '지키려']

# 2026-08-13 uncovered → covered. **자료 문제가 아니라 랭킹 문제**라서 리콜과 같이
# 승격한다. ASPCA 분리불안 문서 안에 "To Crate or Not to Crate?" 단락이 통째로 있고
# (chunk 11270), 질문이 "안 들어가려 한다"이므로 이 단락이 정면으로 답한다 —
#   "크레이트 훈련은 개가 '혼자 있을 때 갈 수 있는 안전한 곳'으로 배우면 도움이
#    되지만 어떤 개에게는 스트레스를 키운다. 헐떡임·침 흘림·탈출 시도·하울링이
#    보이면 크레이트 감금이 맞지 않으니 베이비 게이트로 방 하나에 두라."
#
# 그런데 검색이 못 찾는다. 이 질문에서 0.650인데 상위 5건 커트라인이 0.671이라
# 0.021 차이로 밀린다. 밀어낸 것은 둔감화·역조건화 일반론 청크들인데, **질의
# 재작성이 "desensitization and counterconditioning"을 붙여준 게 원인**이다.
# 방법론 용어가 방법론 문서를 끌어올려 정작 주제 문서를 밀어냈다.
#
# keywords에서 den·gradual을 뺐다. den은 부분 문자열이라 sudden·evidence에 걸리고,
# gradual은 둔감화 문서 아무거나 통과시킨다 — 실제로 크레이트 얘기가 없는 근거로
# 통과할 뻔했다. 크레이트를 실제로 다루는 근거를 찾아야만 통과하게 좁힌다.
- question: "켄넬에 들어가기 싫어하는데 크레이트 훈련 어떻게 시작해요"
  topic: crate-training
  expect: covered
  keywords: [crate, kennel, '켄넬', '크레이트', '집']

# 2026-08-13 추가. 사용자가 실제로 물어서 코퍼스를 뒤져보고 넣었다.
# **반쪽만 있는 주제**다 — "혼자 있을 때 배변한다"는 분리불안 증상으로 잘 다뤄지지만
# (35청크), 반대 패턴인 "혼자 있을 때 참고 안 한다"(억제된 배변)는 자료가 없다.
# 억제·참기로 검색해도 잡히는 5건이 전부 "hold your hand" 오탐이었다.
# 그러니 정답은 거절이나 되묻기다. 근거를 붙여 답하면 지어낸 것이다.
- question: "혼자 있을 때는 하루 종일 대변을 안 봐요 보호자가 있을 때만 봐요"
  topic: inhibited-elimination
  expect: uncovered
  keywords: [holding, inhibited, refuse to eliminate, '참는', '배변을 참', '억제']

