# RSPCA "Train Your Dog To Come When Called" 문서가 있는데도 논문에 밀려
# 상위에 못 온다. 자료 문제가 아니라 **랭킹 문제**라서 covered로 둔다 —
# doc_type 부스트(C)가 이걸 해결해야 한다.
- question: "이름 불러도 안 와요 오라고 하면 도망가요"
