# 검색 품질 평가셋 — 실제 보호자 어투
#
# coverage_questions.yaml과 다른 목적이다. 저쪽은 "네 축에 문서가 있나"를 보는
# 수집 단계 체크리스트고, 이건 **보호자가 실제로 쓰는 문장으로 검색이 쓸 만한가**를
# 잰다. 문장이 구어체·오타·감정 표현을 포함하는 게 의도다.
#
# expect:
#   covered      — 코퍼스에 전용 문서가 있어야 하고, 근거를 찾아야 통과
#   uncovered    — 아직 문서가 없는 주제. **거절해야 통과** (자료 없다고 말해야 함)
#   out-of-scope — 이 서비스 범위 밖. **거절해야 통과**
#
# uncovered/out-of-scope가 이 평가셋의 절반이다. 근거가 없을 때 지어내지 않는지가
# "RAG 느낌"의 핵심이기 때문이다. 자료를 보강하면 uncovered → covered로 옮긴다.
#
# keywords: 근거 문서라면 포함할 법한 영어 표현 (코퍼스가 영어)

# ── 전용 문서가 있는 주제 ──────────────────────────────
- question: "강아지가 초인종 소리만 들리면 미친듯이 짖어요"
  topic: barking
  expect: covered
  keywords: [bark, alarm, territorial, doorbell]

- question: "혼자 두고 나가면 집안 물건을 다 물어뜯어놔요"
  topic: destructive-chewing
  expect: covered
  keywords: [destructive, chew, separation]

- question: "출근하려고 하면 따라다니면서 낑낑대고 난리나요"
  topic: separation-anxiety
  expect: covered
  keywords: [separation, anxiety, departure, alone]

- question: "손을 자꾸 입으로 깨물어요 아직 아기라서 그런가요"
  topic: mouthing
  expect: covered
  keywords: [mouthing, nipping, bite inhibition, play biting]

- question: "산책하다가 다른 개만 보면 짖고 달려들어서 무서워요"
  topic: reactivity
  expect: covered
  keywords: [bark, desensitization, counterconditioning, threshold]

- question: "얌전하던 애가 요즘 갑자기 공격적으로 변했어요 병원 가야 하나요"
  topic: medical-differential
  expect: covered
  keywords: [medical, pain, veterinarian, rule out, underlying]

- question: "나이 든 강아지가 밤에 안 자고 계속 서성거려요"
  topic: cognitive-dysfunction
  expect: covered
  keywords: [cognitive, dysfunction, senior, aging, sleep]

- question: "혼내면 그때만 멈추고 또 그래요 벌 주는 게 맞나요?"
  topic: punishment
  expect: covered
  keywords: [punishment, aversive, fear, aggression]

- question: "강아지가 자꾸 하품하고 입술을 핥아요 스트레스인가요"
  topic: stress-signals
  expect: covered
  keywords: [yawn, lip lick, calming, stress, signal]

- question: "꼬리 흔드는데 왜 으르렁거리죠? 좋다는 거 아닌가요"
  topic: body-language
  expect: covered
  keywords: [tail, growl, body language, arousal]

# ── 아직 전용 문서가 없는 주제 (보강 목표) ──────────────
# 자료를 넣으면 expect를 covered로 바꾸고 리포트를 다시 돌린다.
# 2026-08-12 RSPCA 추가로 covered로 승격 — 배변 문서가 실제로 1위로 올라온다
- question: "6개월 강아지인데 배변을 자꾸 아무데나 해요 어떻게 가르쳐요"
  topic: house-training
  expect: covered
  keywords: [house training, toilet, housetraining, elimination, schedule]

- question: "집에 들어오면 너무 흥분해서 막 뛰어올라요"
