# ASPCA 공격성 문서 + RSPCA leave 문서가 이 주제를 덮는지 평가셋이 판정하게 둔다.
# 전용 문서는 여전히 없다 — 실패하면 그게 정직한 정보다.
- question: "밥그릇 근처 가면 으르렁거려요 뺏길까봐 그러는 거죠?"
  topic: resource-guarding
  expect: covered
  keywords: [resource guarding, food guarding, possessive, trade, leave]

# 2026-08-13 uncovered → covered. **자료 문제가 아니라 랭킹 문제**라서 리콜과 같이
# 승격한다. ASPCA 분리불안 문서 안에 "To Crate or Not to Crate?" 단락이 통째로 있고
# (chunk 11270), 질문이 "안 들어가려 한다"이므로 이 단락이 정면으로 답한다 —
#   "크레이트 훈련은 개가 '혼자 있을 때 갈 수 있는 안전한 곳'으로 배우면 도움이
#    되지만 어떤 개에게는 스트레스를 키운다. 헐떡임·침 흘림·탈출 시도·하울링이
#    보이면 크레이트 감금이 맞지 않으니 베이비 게이트로 방 하나에 두라."
#
# 그런데 검색이 못 찾는다. 이 질문에서 0.650인데 상위 5건 커트라인이 0.671이라
# 0.021 차이로 밀린다. 밀어낸 것은 둔감화·역조건화 일반론 청크들인데, **질의
# 재작성이 "desensitization and counterconditioning"을 붙여준 게 원인**이다.
# 방법론 용어가 방법론 문서를 끌어올려 정작 주제 문서를 밀어냈다.
#
# keywords에서 den·gradual을 뺐다. den은 부분 문자열이라 sudden·evidence에 걸리고,
# gradual은 둔감화 문서 아무거나 통과시킨다 — 실제로 크레이트 얘기가 없는 근거로
# 통과할 뻔했다. 크레이트를 실제로 다루는 근거를 찾아야만 통과하게 좁힌다.
- question: "켄넬에 들어가기 싫어하는데 크레이트 훈련 어떻게 시작해요"
  topic: crate-training
  expect: covered
  keywords: [crate, kennel]

