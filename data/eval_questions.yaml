  keywords: [recall, come when called, cue, reward]

# ASPCA 공격성 문서 + RSPCA leave 문서가 이 주제를 덮는지 평가셋이 판정하게 둔다.
# 전용 문서는 여전히 없다 — 실패하면 그게 정직한 정보다.
- question: "밥그릇 근처 가면 으르렁거려요 뺏길까봐 그러는 거죠?"
