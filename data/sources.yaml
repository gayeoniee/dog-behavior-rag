# ── ②④ MSD Vet Manual — 제외됨 (2026-08-12) ──────────────────
#
# msd-dog-behavior (cause/medical/problem 축, 4개 URL)를 여기서 제거했다.
# 다시 추가하기 전에 아래를 읽을 것.
#
# ToS 확인 2026-08-12 (msd.com/terms-of-use/terms-of-use-for-the-united-states):
#   robots.txt는 4개 URL 전부 허용이지만 ToS가 수집 자체를 막는다 —
#   "use any manual or automated software, devices or other processes (including but
#    not limited to spiders, robots, bots, scrapers, crawlers, avatars, data mining
#    tools or the like) to 'scrape', 'data mine', extract, view, access or download
#    any data, content or materials from the Services"
#   ASPCA와 달리 "manual"이 포함돼 있어서 브라우저 수동 저장(fetcher: local)으로도
#   우회되지 않는다. 재사용은 별도 서면 허가가 필요하다 —
#   "You may not distribute, modify, transmit, reuse, repost, or use the content of
#    the Services for public or commercial purposes...without the written permission"
#
# 대체 방향: 이 소스가 덮던 cause/medical 축은 CC-BY 오픈액세스 문헌으로 채운다.
#   - PMC OA 서브셋은 라이선스가 메타데이터 필드로 오므로 ToS를 읽을 필요가 없다
#   - 인지장애: pmc.ncbi.nlm.nih.gov/articles/PMC12390195 (Diagnosis of CCDS)
#               mdpi.com/2076-2615/16/7/1114 (Evidence-Based Clinical Management)
#   - 분리불안: frontiersin.org/articles/10.3389/fvets.2019.00499/full
# 정 필요하면 msdvetmanual.com/content/permissions 로 허가를 신청하는 경로도 있다.

