# 수집 대상 소스 레지스트리
#
# 필드 설명:
#   fetcher:    pdf | html | local
#   axis:       problem(문제행동) / cause(행동의 이유) / training(훈련·교정) / medical(의학적 감별)
#   volatility: stable(학습이론·바디랭귀지 등 — 연도로 안 거름)
#               volatile(약물·인지장애 등 — 최신 우선, 5년 넘으면 리포트가 경고)
#   license:    수집 전 robots.txt/ToS 확인 결과. "pending-check"면 아직 수집하지 말 것.
#   superseded_checked_at: 더 새 판이 있는지 확인한 날짜 (같은 조사를 반복하지 않기 위한 기록)
#   license_checked_at:    ToS를 실제로 읽어본 날짜
#
# ⚠️ license: pending-check 인 소스는 fetch가 거부한다.
#    robots.txt/ToS를 확인하고 값을 갱신한 뒤 수집할 것.
#
# license 값의 의미 (2026-08-12 기준 실제 사용되는 값):
#
#   public-position-statement   기관이 배포 목적으로 낸 공개 성명서
#   public-guideline-pdf        기관이 공개한 진료 가이드라인 PDF
#   korea-gov-publication       공공저작물 — 개별 파일의 공공누리 유형 확인
#   personal-use-only           ToS가 개인·비상업 이용으로 한정한 소스.
#                               ★ 앱 배포 시 코퍼스에서 제외하거나 허가를 받아야 한다.
#   personal-use-only-manual-copy
#                               위와 같되 자동 수집까지 금지된 소스. 사람이 브라우저로
#                               저장한 파일만 쓸 수 있어 fetcher: local 이다.
#
# 배포 전 재검토 대상은 corpus.jsonl의 license 필드로 걸러낼 수 있다
# (normalize.py가 문서마다 이 값을 실어 보낸다).

