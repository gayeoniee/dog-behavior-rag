# ── 한국어 영상 자료 (2026-08-15 추가) ──────────────────────────────
#
# **왜 넣는가.** 09장 하이브리드 실험에서 293문항 중 37%가 "벡터도 BM25도 못 찾음"
# 이었다. 검색기를 더 붙여서 해결되는 게 아니라 **자료가 없어서 못 찾는** 것이다.
# 05장에서도 보호자 질문에 답할 수 있는 청크가 320개(전체의 2.8%)뿐이었다.
# 코퍼스가 100% 영어·96% 논문이라는 게 병목이다.
#
# **CLAUDE.md의 "유튜브·블로그 배제" 원칙과의 관계.** 그 원칙의 이유는 두 개였다 —
# ToS, 그리고 지배이론 오염. 멘토 조언으로 라이선스는 논외가 됐고, 오염 문제는
# 이미 `corpus` 필드(answer/observation)라는 장치가 있다. 즉 "넣느냐"가 아니라
# **"어느 풀에 넣느냐"**의 문제다.
#
# **내용 확인 (2026-08-15).** 자막을 실제로 뽑아 읽었다. 상담 형식이고 수의사 협진·
# 약물치료를 언급하는 등 현대적 접근이며 **지배이론(알파독·서열·제압) 흔적이 없다.**
# 다만 자동자막이라 오탈자가 많고("수의사"→"수혜사") 구어체 잡담이 섞여 있어,
# `scripts.collect.refine_transcripts`로 LLM 정제를 거친 뒤 적재한다.
#
# ⚠️ 채널을 잘못 짚을 뻔했다. `@bodeum`은 이름만 같은 **게임 방송 채널**이다
#   (PUBG·디아블로·음악방송). 반드시 `@Bodeumofficial`이어야 한다.
- id: bodeum-tv
  name: 강형욱의 보듬TV (훈련·상담 영상 자막)
  urls:
    - https://www.youtube.com/@Bodeumofficial/videos
  fetcher: youtube
  language: ko
  species: dog
  axis: [problem, training, cause]
  authority_tier: 2   # 기관·학술(1)은 아니지만 국내 최상급 실무자다
  methodology: reward_based
  published_at: 2024
  volatility: stable
  license: mentor-approved-personal-use
  license_checked_at: 2026-08-15
  corpus: observation
  # 일단 격리해서 받는다. 정제 결과를 읽고 품질이 확인되면 answer로 승격한다.
  # 승격은 코드 한 줄이지만 되돌리기는 어렵다(답변이 이미 나간 뒤다).
  meta:
    limit: 30
    # 이 채널은 제목을 영어로 올린다. 한국어 마커만 넣었더니 120개 중 1개만
    # 걸렸다 — 실제 태그는 [Puppy Training] 22개, [Junior Training], [Dog Talk]다.
    markers:
      - Puppy Training
      - Puppy training
      - Training for puppy
      - Junior Training
      - Dog Talk
      - 퍼피교육
      - 문제행동
      - 행동교정

# 재생목록 3종 (2026-08-15 추가). **채널 제목 필터보다 재생목록이 낫다** —
# 사람이 이미 골라놓은 묶음이고, 이 채널은 제목이 영어로 번역돼 있어 마커 필터가
# 120개 중 1개만 남긴 적이 있다. fetcher는 URL에 list=가 있으면 필터를 끈다.
#
# 우선순위: 소소한 Q&A > 퍼피교육 > 기초 교육
#   Q&A는 편당 2~3분에 **질문 하나 → 답 하나** 구조라 정보 밀도가 가장 높고,
#   정제 LLM 호출도 편당 1회로 끝난다. 기초 교육은 편당 10~19분이라 3~5배 든다.
- id: bodeum-qna
  name: 강형욱의 보듬TV — 소소한 Q&A (214편)
  urls:
    - https://www.youtube.com/playlist?list=PLVh3TM0B0Wtl4KWJyTNhVG1snnJQT7qfI
  fetcher: youtube
  language: ko
  species: dog
  axis: [problem, cause, training]
  authority_tier: 2
  methodology: reward_based
  published_at: 2024
  volatility: stable
  license: mentor-approved-personal-use
  license_checked_at: 2026-08-15
  corpus: observation
  meta:
    limit: 220
    # 편당 2~3분이라 자막이 700~900자다. 기본 임계(400)로도 통과하지만 명시해 둔다 —
    # 처음에 1,500(8분짜리 상담 영상 기준)으로 잡았다가 원하는 영상을 거의 다 걸렀다.
    min_chars: 400
    # **214편은 천천히 받는 수밖에 없다.** 퍼피교육 26편을 편당 1.7초로 받고
    # 429에 막혔다(2026-08-15). 익명 상태의 자막 쿼터가 수십 건 규모라는 뜻이다.
    # 편당 약 50초면 214편에 3시간이 걸리는데, 이제 매 편 저장하므로 도중에
    # 막혀도 거기까지는 남는다. **끝까지 못 가도 손해가 없는 구조**라서 이 값을
    # 감당할 수 있다. 줄이지 말 것 — 빠르게 받으려던 시도가 일곱 번 실패했다.
    subtitle_delay: [40, 60]
    video_delay: [3, 8]
    request_delay: 4

- id: bodeum-basics
  name: 강형욱의 보듬TV — 기초 교육 (153편)
  urls:
