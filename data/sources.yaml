# ── ⑤ PMC Open Access 서브셋 (pmc fetcher) ────────────────────
#
# 이 블록이 코퍼스 확대의 주력이다. 기관 웹사이트는 건건이 ToS를 읽어야 하고
# 대부분 personal-use-only로 끝나는데, PMC OA는 **라이선스가 논문 메타데이터로
# 같이 온다** (JATS <permissions><license>). 읽을 약관이 없고 CC-BY면 배포도 된다.
# MSD 제거 주석에서 "CC-BY 오픈액세스로 채운다"고 적어둔 그 대체 경로다.
#
# urls 대신 query(esearch term)를 쓴다. 질의는 반드시 [tiab]로 좁힐 것 —
# 2026-08-12 검증에서 'canine separation anxiety'를 그대로 넣었더니 3,815건이
# 잡혔고 상위 5건 중 4건이 치매 알림 시스템·이란 디아스포라 건강 같은 무관 논문이었다.
# 같은 주제를 [tiab]로 좁히면 22건이고 전부 관련 문헌이다.
# (2차 방어로 fetcher가 dog/canine/puppy 언급 3회 미만 문서를 버린다.)
#
# license 필드는 소스 기본값일 뿐이고, 실제 값은 논문마다 RawDoc.meta로 덮어써진다
# (cc-by / cc-by-nc / cc-by-nc-nd / cc0 ...). 배포용 코퍼스를 만들 때는
# corpus.jsonl의 license로 거르면 된다.
#
# NCBI E-utilities는 프로그램 접근용 공식 API라 robots.txt가 아니라 레이트 리밋
# (API 키 없이 3 req/s)으로 사용량을 규율한다. fetcher가 0.4초 지연으로 지킨다.

- id: pmc-separation-anxiety
  name: PMC OA — 개 분리불안
  query: '(dog[tiab] OR dogs[tiab] OR canine[tiab]) AND ("separation anxiety"[tiab] OR "separation-related"[tiab])'
  max_records: 40
  fetcher: pmc
  language: en
  species: dog
  axis: [problem, cause]
  authority_tier: 1
  methodology: reward_based
  published_at: 2024
  volatility: stable
  superseded_checked_at: 2026-08-12
  license: pmc-oa-varies-per-article
  license_checked_at: 2026-08-12

