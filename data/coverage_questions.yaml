# 코퍼스 커버리지 확인 질문
#
# "문서가 많다"와 "답할 수 있다"는 다르다. 네 축을 각각 찌르는 대표 질문으로
# 코퍼스에 근거 문서가 실제로 존재하는지 확인한다.
#
# 지금:   수집 후 corpus.jsonl을 눈으로 확인할 때의 체크리스트
# 나중에: 검색이 붙으면 그대로 검색 품질 회귀 테스트 입력이 된다
#
# keywords: 이 질문의 근거 문서라면 반드시 포함할 법한 단어들 (검증 스크립트용)

- axis: problem
  question: "강아지가 초인종 소리에 계속 짖어요"
  keywords: [bark, alarm, territorial, doorbell]

- axis: problem
  question: "혼자 두고 나가면 집안 물건을 다 물어뜯어요"
  keywords: [separation, destructive, chew]

- axis: cause
  question: "강아지가 자꾸 하품을 하는데 졸린 게 아닌 것 같아요. 왜 그러죠?"
  keywords: [yawn, calming, stress, signal]

- axis: cause
  question: "꼬리를 흔드는데 왜 으르렁거려요?"
  keywords: [body language, tail, growl, arousal]

- axis: training
  question: "짖는 버릇을 어떻게 고치나요?"
  keywords: [desensitization, counterconditioning, reinforcement, reward]

- axis: training
  question: "벌을 주면 안 되나요? 혼내면 그때만 멈춰요"
  keywords: [punishment, aversive, fear, aggression]

- axis: medical
  question: "얌전하던 애가 갑자기 공격적으로 변했어요. 병원에 가야 하나요?"
  keywords: [medical, pain, veterinarian, underlying, rule out]

- axis: medical
  question: "나이 든 강아지가 밤에 서성거리고 벽을 보고 있어요"
  keywords: [cognitive, senior, dysfunction, aging]
