[project]
name = "gy-rag"
version = "0.1.0"
description = "반려동물 훈련/문제행동 상담 RAG 시스템"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 실제 임베딩/추론용. torch가 딸려오므로 수 GB — 필요할 때만 `uv sync --extra hf`
hf = [
    "sentence-transformers>=3.3",
    "transformers>=4.46",
]
# 테스트용 Streamlit 데모 클라이언트
demo = [
    "streamlit>=1.40",
]
# provider를 Claude로 전환할 경우에만 (현재 미사용)
claude = [
    "anthropic>=0.40",
]
# 데이터 수집 파이프라인 (scripts/collect/)
collect = [
    "pypdf>=5.1",
    "selectolax>=0.3.27",
    "pyyaml>=6.0",
    # 유튜브 자막 수집 (fetchers/youtube.py). 자막만 받으면 이걸로 충분하고
    # ffmpeg도 필요 없다 — 실측상 대상 채널은 전 영상에 한국어 자동자막이 있었다.
    "yt-dlp>=2026.7",
]
# 자막이 없는 영상을 STT로 옮길 때만 (fetchers/youtube.py의 _speech_to_text).
# 무겁다 — ctranslate2·onnxruntime이 딸려온다. PyAV로 디코딩하므로 시스템 ffmpeg은
# 필요 없다(관리자 권한 없는 PC 대비).
stt = [
    "faster-whisper>=1.2",
]
# Docker나 관리자 권한이 없는 머신용 내장 Postgres+pgvector (개발 전용).
# 팀 규칙상 DB는 각자 쓰므로 서버 구성 방법은 자유다 — Docker가 되는 머신은 이게 필요 없다.
pgdev = [
    "pgserver>=0.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# addopts로 integration을 제외하지 않는다. 픽스처가 조건을 보고 skip하므로
# DB를 띄우는 순간 아무도 플래그를 기억하지 않아도 자동으로 돌기 시작한다.
markers = ["integration: Postgres + 적재된 코퍼스 + sentence-transformers가 필요"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
