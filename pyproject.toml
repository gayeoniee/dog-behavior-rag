[project]
name = "gy-rag"
version = "0.1.0"
description = "반려동물 훈련/문제행동 상담 RAG 시스템"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 실제 임베딩/추론용. torch가 딸려오므로 수 GB — 필요할 때만 `uv sync --extra hf`
hf = [
    "sentence-transformers>=3.3",
    "transformers>=4.46",
]
# 테스트용 Streamlit 데모 클라이언트
demo = [
    "streamlit>=1.40",
]
# provider를 Claude로 전환할 경우에만 (현재 미사용)
claude = [
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
